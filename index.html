<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8eaed" />
    <title>STEP Viewer</title>
  </head>
  <body>
    <main id="app">
      <div id="canvas"></div>

      <header class="topbar">
        <div class="brand"><span class="brand-mark"></span> STEP Viewer</div>
        <div id="file-name" class="file-name">No model open</div>
        <div class="file-actions">
          <button id="download" class="share-button" disabled title="Download the original STEP file">Download</button>
          <div class="share-action">
            <button id="share" class="share-button" disabled title="Save a copy to Google Drive and let anyone with the link view and download it">Share</button>
          </div>
          <button id="open" class="open-button"><span>＋</span> Open file</button>
        </div>
        <input id="file-input" type="file" accept=".step,.stp" hidden />
      </header>

      <aside id="share-panel" class="share-panel" hidden>
        <button id="close-share" aria-label="Close sharing message">×</button>
        <p id="share-message" role="status" aria-live="polite"></p>
        <input id="share-link" aria-label="Share link" readonly hidden />
        <div class="share-links">
          <a href="./privacy.html" target="_blank" rel="noopener">Privacy and sharing</a>
          <a id="share-drive" target="_blank" rel="noopener noreferrer" hidden>Open shares folder</a>
        </div>
      </aside>

      <aside class="view-tools" aria-label="View controls">
        <button id="fit" title="Fit model" aria-label="Fit model">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>
            <rect x="8" y="8" width="8" height="8" rx="1"/>
          </svg>
        </button>
        <span></span>
        <button id="measure" title="Measure exact CAD geometry (M)" aria-label="Measure" aria-pressed="false" disabled>M</button>
        <button id="section" title="Section analysis" aria-label="Section" aria-pressed="false" disabled>Section</button>
      </aside>

      <aside id="section-panel" class="selection-panel" hidden>
        <header><strong>Section analysis</strong><button id="section-done" title="Done" aria-label="Done">✓</button></header>
        <small id="section-hint">Click a planar face</small>
        <div id="section-fields" hidden>
          <label class="section-offset">Offset <input id="section-offset" type="number" step="any" value="0"> mm</label>
          <div class="section-actions"><button id="section-flip">Flip</button><button id="section-pick">Pick face</button><button id="section-clear">Clear</button></div>
        </div>
      </aside>
      <aside id="selection-panel" class="selection-panel" hidden aria-live="polite">
        <header><strong id="selection-title"></strong><button id="clear-selection" aria-label="Clear selection" title="Clear selection (Esc)">×</button></header>
        <div id="selection-result"></div>
        <small id="selection-hint"></small>
      </aside>
      <div id="dimension-label" class="dimension-label" hidden></div>

      <aside id="components" class="components" hidden>
        <header class="components-header">
          <div>
            <strong>Components</strong>
            <span id="component-count"></span>
          </div>
          <div class="component-actions">
            <button id="collapse-components" class="collapse-components" title="Collapse panel">−</button>
          </div>
        </header>
        <div class="tree-toolbar">
          <button id="expand-tree">Expand all</button>
          <button id="collapse-tree">Collapse all</button>
          <span></span>
          <button id="show-all">Show all</button>
          <button id="hide-all">Hide all</button>
        </div>
        <div id="component-tree" class="component-tree"></div>
      </aside>

      <button id="empty" class="empty-state">
        <span class="file-icon">STEP</span>
        <strong>Drop a STEP file here</strong>
        <small>or click to browse · .step and .stp</small>
      </button>

      <div id="loading" class="loading-card" hidden>
        <span class="spinner"></span><span id="loading-text">Reading CAD geometry…</span>
      </div>

      <footer class="statusbar">
        <div><span id="status-dot" class="status-dot"></span><span id="status">Drop a STEP file anywhere</span></div>
        <div id="model-stats" class="model-stats" hidden></div>
        <button id="edges" class="active" disabled>Edges</button>
        <div class="mouse-help"><b>Drag</b> rotate <b>Shift + drag</b> pan <b>Scroll</b> zoom</div>
      </footer>

      <div id="drop-layer" class="drop-layer" hidden>
        <div><span>↓</span><strong>Drop to open</strong></div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
